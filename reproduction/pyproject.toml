[project]
name = "marble-reproduction"
version = "0.1.0"
description = "Reproducible MARBLE paper experiments and numerical result audits"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "torch==2.5.1+cpu",
    "torch-geometric==2.1.0.post1",
    "torch-cluster==1.6.3+pt25cpu",
    "torch-scatter==2.1.2+pt25cpu",
    "torch-sparse==0.6.18+pt25cpu",
    "matplotlib==3.8.4",
    "pandas==2.2.3",
    "networkx==3.4.2",
    "scikit-learn==1.3.2",
    "seaborn==0.13.2",
    "umap-learn==0.5.7",
    "numba==0.61.2",
    "POT==0.9.5",
    "tensorboardX==2.6.2.2",
    "pyyaml==6.0.2",
    "mat73==0.65",
    "wget==3.2",
    "pympl==1.2.1",
    "Cython==0.29.37",
    "setuptools==75.8.0",
    "wheel==0.45.1",
    "pytest==8.3.5",
    "ruff==0.11.2",
    "cebra==0.4.0",
    "elephant==1.1.1",
    "neo==0.13.3",
    "quantities==0.15.0",
    "statannotations==0.7.1",
    "markdown==3.7",
]

[tool.uv]
find-links = ["https://data.pyg.org/whl/torch-2.5.1+cpu.html"]
build-constraint-dependencies = ["setuptools==75.8.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 88
extend-exclude = ["upstream", ".uv-cache", ".python", "results"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["MARBLE", "rat_decoding", "repro_io", "train_rat", "modern_gpu", "prepare_gpu_training"]
